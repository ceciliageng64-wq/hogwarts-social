<style>

ttom:1px solid #eff3f4}.capture{background:white;max-width:640px;margin:auto;color:#0f1419}.watermark{font-size:11px;padding:12px 18px 3px;color:#83919c}.tweet{padding:14px 18px 15px;border-bottom:1px solid #eff3f4}.tweet-top,.reply{display:flex;gap:10px}.avatar{width:45px;height:45px;border-radius:50%;object-fit:cover;background:#dce3e7;flex:none}.main{flex:1;min-width:0}.identity{display:flex;flex-wrap:wrap;align-items:center;gap:5px;line-height:1.45}.identity b{font-size:15px}.muted{font-size:12px;color:#536471}.verify{font-size:11px;background:#1d9bf0;color:white;border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}.content{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;margin:6px 0 9px}.media{width:100%;max-height:480px;object-fit:contain;border-radius:15px;border:1px solid #eff3f4;display:block;margin-top:10px}.stats{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#536471;padding-top:13px}.reply-heading{padding:15px 18px;border-bottom:1px solid #eff3f4;font-weight:800}.reply{border-bottom:1px solid #eff3f4;padding:14px 18px}.reply .avatar{width:40px;height:40px}.reply .content{font-size:14px}.reply-to{color:#1d9bf0;font-size:12px;margin-top:4px}.reply-stats{display:flex;justify-content:space-between;font-size:12px;color:#536471;margin-top:9px}.footer{font-size:11px;color:#89959e;text-align:center;padding:12px}.tabs{display:none}.download-help{margin:6px 0 0;color:#536471;font-size:11px}
@media(max-width:760px){body{background:#fff}.bar{height:53px}.wrap{display:block;margin:0;padding:0}.editor{border:none;border-radius:0;position:static;max-height:none;padding:14px}.preview-box{border:none;border-top:8px solid #f2f5f6;border-radius:0}.preview-title{display:none}.tabs{display:flex;gap:7px}.tabs button{padding:7px 10px;border:0;border-radius:999px;background:#eff3f4;color:#536471}.tabs button.selected{background:#0f1419;color:white}body.mobile-preview .editor{display:none}body:not(.mobile-preview) .preview-box{display:none}.bar strong{font-size:13px}.button-row{padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}}
</style></head><body><header class="bar"><div><strong>𝕏 今日霍格沃茨不宜恋爱</strong><small>狗卷出品 · 捡手机制作台</small></div><div class="tabs"><button id="editTab" class="selected">编辑</button><button id="previewTab">预览</button></div></header>
<div class="wrap"><section class="editor"><h2>制作一条 X 帖子</h2><p class="hint">支持主贴、头像、配图、互动数字与多条评论；无需登录，编辑不影响原网站。</p>
<div class="sec">主贴信息</div>
<div class="field"><label>显示昵称</label><input id="name" value="阿德里安·普赛"></div>
<div class="pair"><div class="field"><label>@用户名</label><input id="handle" value="adrianpucey"></div><div class="field"><label>发布时间</label><input id="date" value="1993年11月15日 21:13"></div></div>
<label class="check"><input id="verified" type="checkbox" checked>显示蓝色认证</label>
<div class="field"><label>头像（自动圆形裁切显示）</label><input type="file" id="avatar" accept="image/*"></div>
<div class="field"><label>主贴文字</label><textarea id="body">手滑</textarea></div>
<div class="field"><label>主贴配图</label><input type="file" id="media" accept="image/*"></div>
<div class="sec">互动数字</div>
<div class="pair"><div class="field"><label>评论</label><input id="replies" value="101"></div><div class="field"><label>转发</label><input id="reposts" value="70"></div><div class="field"><label>喜欢</label><input id="likes" value="402"></div><div class="field"><label>浏览</label><input id="views" value="15.6K"></div></div>
<div class="sec">评论楼层</div><div id="commentEditors"></div><div class="button-row"><button class="btn" id="add">＋ 添加评论</button><button class="btn" id="clear">清空评论</button></div>
<div class="sec">生成截图</div><div class="button-row"><button class="btn blue" id="savePost">下载主贴 PNG</button><button class="btn blue" id="saveAll">下载主贴＋评论 PNG</button></div><p class="download-help">手机上如无法自动保存，截图生成后可长按图片保存。图片保存在本机，不上传服务器。</p></section>
<section class="preview-box"><div class="preview-title">帖子与评论</div><div id="capture" class="capture"><div class="watermark">今日霍格沃茨不宜恋爱 · 狗卷出品</div><article class="tweet"><div class="tweet-top"><img id="avatarView" class="avatar"><div class="main"><div class="identity"><b id="nameView"></b><span id="verifiedView" class="verify">✓</span><span class="muted" id="handleView"></span><span class="muted" id="dateView"></span></div><div class="content" id="bodyView"></div><img class="media" id="mediaView" hidden><div class="stats"><span>◯ <span id="repliesView"></span></span><span>↻ <span id="repostsView"></span></span><span>♡ <span id="likesView"></span></span><span>▥ <span id="viewsView"></span></span><span>♧</span></div></div></div></article><div id="commentsView"></div><div class="footer">今日霍格沃茨不宜恋爱 · 狗卷出品</div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const blank='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#dce3e7"/><circle cx="50" cy="37" r="19" fill="white"/><path d="M14 100c2-25 16-37 36-37s34 12 36 37" fill="white"/></svg>');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let avatar=blank,media='',comments=[];
const fileData=(file,cb)=>{if(!file)return;const reader=new FileReader();reader.onload=()=>cb(reader.result);reader.readAsDataURL(file)};
function render(){
 $('avatarView').src=avatar;$('nameView').textContent=$('name').value||'未命名';$('handleView').textContent='@'+$('handle').value;$('dateView').textContent='· '+$('date').value;$('bodyView').textContent=$('body').value;$('verifiedView').hidden=!$('verified').checked;
 $('mediaView').hidden=!media;if(media)$('mediaView').src=media;
 for(const k of ['replies','reposts','likes','views'])$(k+'View').textContent=$(k).value;
 $('commentsView').innerHTML=comments.length?'<div class="reply-heading">全部评论（'+comments.length+'）</div>'+comments.map(c=>'<div class="reply"><img class="avatar" src="'+c.avatar+'"><div class="main"><div class="identity"><b>'+esc(c.name)+'</b><span class="muted">@'+esc(c.handle)+'</span><span class="muted">· '+esc(c.date)+'</span></div>'+(c.to?'<div class="reply-to">回复 @'+esc(c.to.replace(/^@/,''))+'</div>':'')+'<div class="content">'+esc(c.text)+'</div>'+(c.media?'<img class="media" src="'+c.media+'">':'')+'<div class="reply-stats"><span>◯ '+esc(c.replies)+'</span><span>♡ '+esc(c.likes)+'</span></div></div></div>').join(''):'';
}
function editComments(){
 $('commentEditors').innerHTML=comments.map((c,i)=>'<div class="comment-form" data-index="'+i+'"><div class="comment-head">评论 '+(i+1)+' <button class="btn red" data-del="'+i+'">删除</button></div><div class="pair"><div class="field"><label>昵称</label><input data-key="name" value="'+esc(c.name)+'"></div><div class="field"><label>@用户名</label><input data-key="handle" value="'+esc(c.handle)+'"></div></div><div class="field"><label>时间</label><input data-key="date" value="'+esc(c.date)+'"></div><div class="field"><label>回复谁（选填）</label><input data-key="to" value="'+esc(c.to)+'"></div><div class="field"><label>评论正文</label><textarea data-key="text">'+esc(c.text)+'</textarea></div><div class="pair"><div class="field"><label>评论数</label><input data-key="replies" value="'+esc(c.replies)+'"></div><div class="field"><label>喜欢数</label><input data-key="likes" value="'+esc(c.likes)+'"></div></div><div class="field"><label>评论头像</label><input type="file" accept="image/*" data-av="'+i+'"></div><div class="field"><label>评论配图</label><input type="file" accept="image/*" data-media="'+i+'"></div></div>').join('');
 $('commentEditors').querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{comments[Number(el.closest('[data-index]').dataset.index)][el.dataset.key]=el.value;render()}));
 $('commentEditors').querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{comments.splice(Number(el.dataset.del),1);editComments();render()});
 $('commentEditors').querySelectorAll('[data-av]').forEach(el=>el.onchange=()=>fileData(el.files[0],s=>{comments[Number(el.dataset.av)].avatar=s;render()}));
 $('commentEditors').querySelectorAll('[data-media]').forEach(el=>el.onchange=()=>fileData(el.files[0],s=>{comments[Number(el.dataset.media)].media=s;render()}));
}
function add(c={}){comments.push({name:c.name||'Maya Williams',handle:c.handle||'mayawilliams',date:c.date||'1993年11月15日 21:27',text:c.text||'有人知道刚才发生什么了吗？',to:c.to||'',likes:c.likes||'17',replies:c.replies||'4',avatar:blank,media:''});editComments();render()}
for(const id of ['name','handle','date','verified','body','replies','reposts','likes','views'])$(id).addEventListener('input',render);
$('avatar').onchange=e=>fileData(e.target.files[0],s=>{avatar=s;render()});$('media').onchange=e=>fileData(e.target.files[0],s=>{media=s;render()});$('add').onclick=()=>add();$('clear').onclick=()=>{comments=[];editComments();render()};
function setTab(preview){document.body.classList.toggle('mobile-preview',preview);$('editTab').classList.toggle('selected',!preview);$('previewTab').classList.toggle('selected',preview);window.scrollTo(0,0)}
$('editTab').onclick=()=>setTab(false);$('previewTab').onclick=()=>setTab(true);
async function savePng(full){
 if(!window.html2canvas){alert('截图组件暂未加载，请联网后重试');return}
 const root=$('capture'),clone=root.cloneNode(true);
 clone.style.cssText='position:fixed;left:0;top:0;width:600px;max-width:none;background:#fff;z-index:-999;pointer-events:none;transform:translateX(-200vw)';
 if(!full){clone.querySelector('#commentsView')?.remove();clone.querySelector('.footer')?.remove()}
 document.body.append(clone);
 try{
 await Promise.all([...clone.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()));
 const canvas=await html2canvas(clone,{backgroundColor:'#fff',scale:2,useCORS:true,logging:false,scrollX:0,scrollY:0});
 const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('PNG 导出失败')),'image/png'));
 const name=full?'今日霍格沃茨_帖子与评论.png':'今日霍格沃茨_主贴.png';
 if(navigator.canShare&&navigator.share){try{const file=new File([blob],name,{type:'image/png'});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name==='AbortError')return}}
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
 }catch(e){alert('导出失败：'+(e.message||e))}finally{clone.remove()}
}
$('savePost').onclick=()=>savePng(false);$('saveAll').onclick=()=>savePng(true);
add({name:'Maya Williams',text:'有人知道刚才走廊里发生什么了吗？'});add({name:'the friend with receipts',handle:'friendwithreceipts',text:'我只是来吃瓜的，真的。',to:'mayawilliams',date:'1993年11月15日 21:41'});
</script></body></html>
