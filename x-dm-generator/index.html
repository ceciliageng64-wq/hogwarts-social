<!doctype html>
<html lang="zh-CN">
<head>

<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft Yahei",Arial,sans-serif;color:#0f1419;background:#f0f3f5}*{box-sizing:border-box}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.app{min-height:100vh;display:grid;grid-template-columns:355px minmax(0,1fr)}.controls{height:100vh;overflow-y:auto;background:#fff;border-right:1px solid #dbe2e8;padding:22px 19px 60px;position:sticky;top:0}.controls h1{font-size:20px;margin:0 0 5px;letter-spacing:-.4px}.sub{font-size:12px;color:#677782;line-height:1.6}.section{margin:20px 0 0;padding-top:18px;border-top:1px solid #e7ebef}.section h2{font-size:14px;margin:0 0 13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;font-size:12px;color:#425563}.field input,.field select,.field textarea{border:1px solid #d6dfe5;border-radius:9px;padding:9px 10px;min-width:0;background:#fff;color:#111;outline:none}.field textarea{resize:vertical;min-height:70px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#1d9bf0;box-shadow:0 0 0 2px #1d9bf01b}.btn{border:1px solid #d8e1e8;background:#fff;color:#1c2933;border-radius:9px;padding:9px 11px;font-weight:600;font-size:13px}.btn.primary{background:#1d9bf0;color:#fff;border-color:#1d9bf0}.btn.danger{color:#ca3546}.btnrow{display:flex;gap:7px;flex-wrap:wrap}.btnrow>*{flex:1}.uploader{display:flex;gap:7px;align-items:center}.uploader img{width:42px;height:42px;object-fit:cover;border-radius:50%;background:#e6ecf0}.uploader input{width:100%;min-width:0;font-size:11px}.message-list{display:grid;gap:7px;max-height:275px;overflow:auto}.message-edit{border:1px solid #e4e9ee;border-radius:11px;padding:9px;background:#fafcfd}.message-edit-top{display:flex;gap:6px;align-items:center;margin-bottom:7px}.message-edit-top select{min-width:0;flex:1;padding:5px;border-radius:6px;border:1px solid #dbe1e6;background:#fff;font-size:12px}.message-edit-top button{border:0;background:transparent;color:#8794a0;font-size:12px;padding:4px}.message-edit textarea{width:100%;resize:vertical;min-height:46px;font-size:12px;padding:7px;border:1px solid #dbe1e6;border-radius:6px}.preview-space{padding:22px;min-width:0}.previewbar{max-width:1270px;margin:auto auto 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.previewbar h2{margin:0;font-size:16px}.previewbar small{color:#6b7c88}.seg{display:flex;gap:3px;border:1px solid #dce3e8;background:#fff;border-radius:10px;padding:3px}.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:#526574;font-size:12px}.seg button.active{background:#e6f4ff;color:#117ac0;font-weight:700}.stage{overflow:auto;max-width:1270px;margin:auto;border-radius:16px;box-shadow:0 10px 44px #2636431a;background:white;padding:0;display:flex;justify-content:center}.preview{--bg:#fff;--text:#0f1419;--muted:#536471;--line:#eff3f4;--blue:#1d9bf0;--hover:#f7f9f9;--panel:#fff;--bubble:#eff3f4;background:var(--bg);color:var(--text);width:100%;min-height:675px;display:grid;grid-template-columns:75px 355px minmax(390px,1fr);position:relative}.preview.dark{--bg:#000;--text:#e7e9ea;--muted:#71767b;--line:#2f3336;--hover:#15181c;--panel:#000;--bubble:#202327}.xnav{border-right:1px solid var(--line);padding:13px 13px;display:flex;flex-direction:column;align-items:center;gap:14px}.xlogo{font-family:Arial,sans-serif;font-size:32px;line-height:1;margin:0 0 9px}.navicon{display:flex;align-items:center;justify-content:center;border-radius:50%;width:49px;height:49px}.navicon.selected{background:var(--hover)}svg.i{width:27px;height:27px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linejoin:round;stroke-linecap:round}.navprofile{margin-top:auto;width:42px;height:42px;border-radius:50%;object-fit:cover;background:#cfd9de}.inbox{border-right:1px solid var(--line);min-width:0}.inbox-head{height:61px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:800}.inbox-head .round{font-size:20px}.search{margin:3px 12px 12px;border-radius:999px;height:42px;display:flex;align-items:center;gap:10px;color:var(--muted);background:var(--hover);font-size:14px;padding:0 16px}.inbox-label{margin:16px 18px 8px;font-weight:700;font-size:14px}.thread-item{padding:15px 13px;display:flex;gap:11px;border-right:3px solid var(--blue);background:var(--hover);min-height:85px}.thread-item .ava{width:48px;height:48px}.thread-meta{flex:1;min-width:0}.thread-name{font-weight:700;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.thread-sub{font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{display:flex;flex-direction:column;min-width:0;min-height:675px}.chat-head{height:61px;padding:9px 17px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.chat-head .ava{width:40px;height:40px}.chat-title{flex:1;min-width:0}.chat-title b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-title small{font-size:12px;color:var(--muted)}.chat-head .info{border:2px solid currentColor;border-radius:50%;width:21px;height:21px;text-align:center;font-size:13px;line-height:17px;font-weight:800}.ava{border-radius:50%;object-fit:cover;flex-shrink:0;background:#cfd9de}.avatar-fallback{display:flex;justify-content:center;align-items:center;font-weight:700;color:white;background:#869aaa}.chat-body{flex:1;padding:24px 17px 32px;display:flex;flex-direction:column;gap:15px;min-height:520px}.chat-profile{display:flex;flex-direction:column;align-items:center;padding:13px 0 25px;gap:5px;text-align:center}.chat-profile .ava{width:66px;height:66px;margin-bottom:6px}.chat-profile b{font-size:17px}.chat-profile small,.chat-profile span{font-size:13px;color:var(--muted)}.date-label{text-align:center;font-size:12px;color:var(--muted);font-weight:500;margin:3px 0}.bubble-row{display:flex;align-items:flex-end;gap:7px;max-width:100%}.bubble-row.mine{justify-content:flex-end}.bubble-row.other{justify-content:flex-start}.bubble-avatar{width:29px;height:29px}.bubble{max-width:75%;border-radius:20px;padding:11px 15px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.42}.mine .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:5px}.other .bubble{background:var(--bubble);color:var(--text);border-bottom-left-radius:5px}.bubble.image-only{padding:3px;background:transparent!important;max-width:68%;border-radius:15px}.bubble img{display:block;width:100%;max-height:470px;object-fit:contain;border-radius:13px}.msg-timestamp{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}.chat-compose{margin:0 12px 11px;border-radius:999px;border:1px solid var(--line);min-height:51px;display:flex;align-items:center;gap:11px;padding:8px 13px;color:var(--blue)}.chat-compose span{flex:1;color:var(--muted);font-size:14px}.chat-compose svg{width:22px;height:22px}.watermark{border-top:1px solid var(--line);text-align:center;padding:11px 12px;color:var(--muted);font-size:11px;letter-spacing:.35px;grid-column:1/-1;white-space:normal}.preview.mobile{width:390px;min-width:390px;grid-template-columns:minmax(0,1fr);min-height:700px}.mobile .xnav,.mobile .inbox{display:none}.mobile .chat{min-height:690px}.mobile .chat-head::before{content:'←';font-size:23px;margin-right:5px}.mobile .chat-body{min-height:570px}.mobile .watermark{grid-column:1}.mobile .bubble{max-width:78%}.mobile .chat-compose{margin-bottom:9px}.photo-line{display:flex;align-items:center;gap:9px}.photo-line img{width:40px;height:40px;border-radius:6px;object-fit:cover}.photo-line .remove{font-size:11px;border:0;background:transparent;color:#d34a52}.help{font-size:12px;line-height:1.6;color:#6d7e8b}.credit{margin-top:12px;text-align:center;color:#748591;font-size:12px}.status{font-size:12px;color:#427995;min-height:19px;margin-top:8px}.filefield{font-size:11px;max-width:100%} @media(max-width:850px){.app{display:block}.controls{position:static;height:auto;border-right:0;border-bottom:1px solid #ddd}.preview-space{padding:15px 8px}.stage{justify-content:flex-start}.previewbar{flex-wrap:wrap}.preview:not(.mobile){min-width:850px}.message-list{max-height:370px}}
</style>
</head>
<body>
<div class="app">
<aside class="controls">
 <h1>𝕏 私信截图创作台</h1><div class="sub">今日霍格沃茨 · 虚构对话创作工具<br>独立 HTML，所有内容只在本地浏览器编辑</div>
 <div class="section"><h2>① 对话与人物</h2>
  <label class="field">对方显示名称<input id="contactName" maxlength="70"></label>
  <div class="formgrid"><label class="field">对方 @账号<input id="contactHandle" maxlength="60"></label><label class="field">自己显示名称<input id="selfName" maxlength="70"></label></div>
  <label class="field">自己 @账号<input id="selfHandle" maxlength="60"></label>
  <div class="formgrid"><label class="field">对方头像<input class="filefield" type="file" accept="image/*" id="contactAvatar"></label><label class="field">自己头像<input class="filefield" type="file" accept="image/*" id="selfAvatar"></label></div>
  <div class="formgrid"><label class="field">对方资料说明<input id="contactBio" maxlength="100"></label><label class="field">对方关注人数<input id="following" maxlength="18"></label></div>
 </div>
 <div class="section"><h2>② 画面设置</h2><div class="formgrid"><label class="field">界面主题<select id="theme"><option value="light">浅色 · X</option><option value="dark">深色 · X</option></select></label><label class="field">截图宽度<select id="layout"><option value="desktop">桌面三栏</option><option value="mobile">手机私信</option></select></label></div><label class="field">对话日期<input id="dateLabel" maxlength="80"></label><label class="field">聊天输入框提示<input id="placeholder" maxlength="70"></label></div>
 <div class="section"><h2>③ 添加新消息</h2><div class="formgrid"><label class="field">发送者<select id="newSender"><option value="other">对方（左侧）</option><option value="mine">我（右侧）</option></select></label><label class="field">时间（可选）<input id="newTime" placeholder="例如 21:06"></label></div><label class="field">消息文字<textarea id="newText" placeholder="输入消息，可换行。Ctrl + Enter 添加"></textarea></label><label class="field">图片消息（可选）<input type="file" id="newImage" class="filefield" accept="image/*"></label><div class="btnrow"><button class="btn primary" id="addMessage">＋ 添加消息</button><button class="btn" id="addDate">＋ 日期分隔</button></div></div>
 <div class="section"><h2>④ 编辑 / 排序现有消息</h2><div class="message-list" id="messageList"></div></div>
 <div class="section"><h2>⑤ 保存与导出</h2><div class="btnrow"><button class="btn primary" id="exportPNG">⬇ 导出 PNG 图片</button><button class="btn" id="saveJSON">保存 JSON</button></div><div class="btnrow" style="margin-top:8px"><button class="btn" id="importJSON">导入 JSON</button><button class="btn danger" id="reset">恢复示例</button></div><input hidden type="file" id="jsonFile" accept="application/json,.json"><p class="help">PNG 固定保留创作水印；JSON 可保存文字、头像和图片，方便下次继续编辑。推荐 Chrome / Edge 导出。</p><div id="status" class="status" role="status"></div></div>
 </aside>
 <main class="preview-space"><div class="previewbar"><div><h2>实时预览</h2><small>编辑左侧内容，右侧即时更新 · 这是虚构 X 风格界面</small></div><div class="seg"><button id="deskTab" class="active">桌面</button><button id="mobileTab">手机</button></div></div><div class="stage"><div class="preview" id="capture"></div></div><div class="credit">纯本地生成 · 不连接任何真实 X 账号 · 仅用于同人剧情 / 模拟设计</div></main>
</div>
<script>
'use strict';
const WATERMARK='今日霍格沃茨不宜恋爱狗卷出品请勿传播';
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const iconPaths={home:'<path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',mail:'<rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 6 10 8 10-8"/>',bookmark:'<path d="M5 3h14v18l-7-5-7 5z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 22c0-6 16-6 16 0"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="2"/><path d="m3 18 6-6 4 4 3-3 5 5"/>',gif:'<rect x="2" y="4" width="20" height="16" rx="4"/><path d="M7 10h3v4H7v-4zm6 0v4m0-4h3m-3 2h3"/>',smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14q4 5 8 0"/><path d="M8 9h.1M16 9h.1"/>',send:'<path d="m3 11 18-8-7 18-3-8-8-2z"/><path d="m11 13 10-10"/>'};
const ico=(name,extra='')=>`<svg class="i" ${extra} viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${iconPaths[name]||''}</svg>`;
const initial=()=>({contactName:'阿德里安·普赛',contactHandle:'adrianpucey',selfName:'狗卷',selfHandle:'puppy',contactBio:'在霍格沃茨 · 1993',following:'互相关注',dateLabel:'1993年11月24日',placeholder:'开始一条新消息',theme:'light',layout:'desktop',contactAvatar:'',selfAvatar:'',messages:[{id:1,type:'date',text:'1993年11月24日'},{id:2,sender:'other',type:'text',text:'你还在公共休息室吗？',time:'21:04'},{id:3,sender:'mine',type:'text',text:'在，怎么了？',time:'21:06'},{id:4,sender:'other',type:'text',text:'别让弗林特知道我来找你。',time:'21:08'},{id:5,sender:'mine',type:'text',text:'……你认真的吗？',time:'21:09'}]});
let state=initial(),nextId=6;
function status(s){$('status').textContent=s;}
function avatar(src,name,classes='ava'){return src?`<img class="${classes}" src="${escapeHTML(src)}" alt="">`:`<div class="${classes} avatar-fallback">${escapeHTML(Array.from(name||'X')[0]||'X')}</div>`;}
function toData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('图片读取失败'));reader.readAsDataURL(file);});}
async function imageData(file){const raw=await toData(file);return new Promise(resolve=>{const img=new Image();img.onload=()=>{const ratio=Math.min(1,1200/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*ratio);cv.height=Math.round(img.height*ratio);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',.88));};img.onerror=()=>resolve(raw);img.src=raw;});}
function syncInputs(){for(const id of ['contactName','contactHandle','selfName','selfHandle','contactBio','following','dateLabel','placeholder','theme','layout'])$(id).value=state[id]??'';toggleTabs();}
function toggleTabs(){$('deskTab').classList.toggle('active',state.layout==='desktop');$('mobileTab').classList.toggle('active',state.layout==='mobile');}
function render(){toggleTabs();const contact=state.contactName||'对方',self=state.selfName||'我',handle='@'+String(state.contactHandle||'account').replace(/^@/,'');const a=avatar(state.contactAvatar,contact),me=avatar(state.selfAvatar,self);const nav=['home','search','bell','mail','bookmark','user','more'].map(x=>`<div class="navicon ${x==='mail'?'selected':''}">${ico(x)}</div>`).join('');const last=[...state.messages].reverse().find(x=>x.type!=='date');const snippet=last?.type==='image'?'[图片]':last?.text||'开始聊天';const messages=state.messages.map(m=>m.type==='date'?`<div class="date-label">${escapeHTML(m.text||'')}</div>`:`<div><div class="bubble-row ${m.sender==='mine'?'mine':'other'}">${m.sender==='other'?avatar(state.contactAvatar,contact,'ava bubble-avatar'):''}<div class="bubble ${m.type==='image'?'image-only':''}">${m.type==='image'?`<img src="${escapeHTML(m.image||'')}" alt="聊天配图">${m.text?`<div style="color:var(--text);background:var(--bubble);padding:8px;border-radius:9px;margin-top:4px">${escapeHTML(m.text)}</div>`:''}`:escapeHTML(m.text)}</div></div>${m.time?`<div class="msg-timestamp">${escapeHTML(m.time)}</div>`:''}</div>`).join('');
$('capture').className='preview '+(state.theme==='dark'?'dark ':'')+(state.layout==='mobile'?'mobile':'');
$('capture').innerHTML=`<div class="xnav"><div class="xlogo">𝕏</div>${nav}<div style="margin-top:auto">${me.replace('class="ava"','class="navprofile"')}</div></div><div class="inbox"><div class="inbox-head"><span>消息</span><span class="round">✉</span></div><div class="search">${ico('search')}搜索私信</div><div class="inbox-label">私信</div><div class="thread-item">${a}<div class="thread-meta"><div class="thread-name">${escapeHTML(contact)} <span style="font-weight:400;color:var(--muted)">${escapeHTML(handle)}</span></div><div class="thread-sub">${escapeHTML(snippet)}</div></div></div></div><div class="chat"><div class="chat-head">${a}<div class="chat-title"><b>${escapeHTML(contact)}</b><small>${escapeHTML(handle)}</small></div><div class="info">i</div></div><div class="chat-body"><div class="chat-profile">${avatar(state.contactAvatar,contact)}<b>${escapeHTML(contact)}</b><small>${escapeHTML(handle)}</small><span>${escapeHTML(state.contactBio)}</span><span>${escapeHTML(state.following)}</span></div>${messages}</div><div class="chat-compose">${ico('image')}${ico('gif')}${ico('smile')}<span>${escapeHTML(state.placeholder)}</span>${ico('send')}</div></div><div class="watermark">${escapeHTML(WATERMARK)} · 虚构对话 / 创作截图</div>`;
renderMessageList();}
function renderMessageList(){const list=$('messageList');list.innerHTML=state.messages.map((m,i)=>`<div class="message-edit"><div class="message-edit-top"><span style="font-size:11px;color:#8395a1">${i+1}.</span><select data-id="${m.id}" data-edit="sender" ${m.type==='date'?'disabled':''}><option value="other" ${m.sender==='other'?'selected':''}>对方</option><option value="mine" ${m.sender==='mine'?'selected':''}>我</option></select><button data-action="up" data-id="${m.id}" title="上移">↑</button><button data-action="down" data-id="${m.id}" title="下移">↓</button><button data-action="delete" data-id="${m.id}" title="删除">✕</button></div>${m.type==='image'?`<div class="photo-line"><img src="${escapeHTML(m.image||'')}" alt="图片"><button class="remove" data-action="image" data-id="${m.id}">更换图片</button></div>`:''}<textarea data-id="${m.id}" data-edit="text" placeholder="${m.type==='date'?'日期':m.type==='image'?'图片说明':'消息正文'}">${escapeHTML(m.text)}</textarea>${m.type!=='date'?`<label style="display:flex;gap:6px;align-items:center;font-size:11px;color:#7a8b99;margin-top:5px">时间 <input style="width:88px;border:1px solid #dbe1e6;border-radius:5px;padding:3px 5px" data-id="${m.id}" data-edit="time" value="${escapeHTML(m.time||'')}"></label>`:''}</div>`).join('');}
for(const id of ['contactName','contactHandle','selfName','selfHandle','contactBio','following','dateLabel','placeholder','theme','layout'])$(id).addEventListener('input',e=>{state[id]=e.target.value;render();});
for(const id of ['contactAvatar','selfAvatar'])$(id).addEventListener('change',async e=>{if(!e.target.files[0])return;try{state[id]=await imageData(e.target.files[0]);render();status('头像已更新');}catch(err){status(err.message)}e.target.value='';});
$('newImage').addEventListener('change',e=>{if(e.target.files[0])status('已选择图片，点击「添加消息」插入');});
$('addMessage').onclick=async()=>{const file=$('newImage').files[0],text=$('newText').value.trim();if(!text&&!file){status('请填写消息文字或选择图片');return;}try{const obj={id:nextId++,sender:$('newSender').value,type:file?'image':'text',text,time:$('newTime').value.trim()};if(file)obj.image=await imageData(file);state.messages.push(obj);$('newText').value='';$('newImage').value='';render();status('消息已添加')}catch(err){status(err.message)}};
$('newText').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')$('addMessage').click();});
$('addDate').onclick=()=>{state.messages.push({id:nextId++,type:'date',text:state.dateLabel||'今天'});render();};
$('messageList').addEventListener('input',e=>{const id=Number(e.target.dataset.id),key=e.target.dataset.edit,m=state.messages.find(x=>x.id===id);if(!m||!key)return;m[key]=e.target.value; // Do not rebuild active textareas while typing.
const focus={id,key,start:e.target.selectionStart};const capture=$('capture');const scrollX=window.scrollX,scrollY=window.scrollY;const current=renderMessageList;renderPreviewOnly();window.scrollTo(scrollX,scrollY);});
$('messageList').addEventListener('change',e=>{const id=Number(e.target.dataset.id),key=e.target.dataset.edit,m=state.messages.find(x=>x.id===id);if(m&&key){m[key]=e.target.value;render();}});
function renderPreviewOnly(){const list=$('messageList');const stateList=list.innerHTML;render();list.innerHTML=stateList;}
$('messageList').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=Number(b.dataset.id),idx=state.messages.findIndex(x=>x.id===id),act=b.dataset.action;if(idx<0)return;if(act==='delete')state.messages.splice(idx,1);if(act==='up'&&idx>0)[state.messages[idx-1],state.messages[idx]]=[state.messages[idx],state.messages[idx-1]];if(act==='down'&&idx<state.messages.length-1)[state.messages[idx],state.messages[idx+1]]=[state.messages[idx+1],state.messages[idx]];if(act==='image'){const pick=document.createElement('input');pick.type='file';pick.accept='image/*';pick.onchange=async()=>{if(pick.files[0]){state.messages[idx].image=await imageData(pick.files[0]);render()}};pick.click();return}render()});
$('deskTab').onclick=()=>{state.layout='desktop';$('layout').value='desktop';render()};$('mobileTab').onclick=()=>{state.layout='mobile';$('layout').value='mobile';render()};
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);}
$('saveJSON').onclick=()=>download(new Blob([JSON.stringify({format:'hogwarts-x-dm-fiction-v1',state},null,2)],{type:'application/json'}),'霍格沃茨_X私信创作存档.json');
$('importJSON').onclick=()=>$('jsonFile').click();
$('jsonFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text()),s=obj.state||obj;if(!Array.isArray(s.messages)||typeof s.contactName!=='string')throw Error('不是有效的聊天存档');state={...initial(),...s,messages:s.messages.filter(x=>x&&typeof x==='object').map((m,i)=>({...m,id:i+1}))};nextId=state.messages.length+1;syncInputs();render();status('存档导入成功');}catch(err){status('导入失败：'+err.message)}e.target.value='';};
$('reset').onclick=()=>{state=initial();nextId=6;syncInputs();render();status('已恢复示例')};
// Dedicated pure Canvas renderer: exported PNG is not dependent on SVG foreignObject
// (which taints Canvas in Chromium) and works with embedded user media offline.
async function exportPNG(){
 const btn=$('exportPNG');btn.disabled=true;status('正在绘制 PNG…');
 try{
 const mobile=state.layout==='mobile',w=mobile?390:1150,navW=mobile?0:75,inboxW=mobile?0:355,chatX=navW+inboxW,chatW=w-chatX;
 const colors=state.theme==='dark'?{bg:'#000000',ink:'#e7e9ea',muted:'#71767b',border:'#2f3336',gray:'#202327',soft:'#15181c',blue:'#1d9bf0'}:{bg:'#ffffff',ink:'#0f1419',muted:'#536471',border:'#eff3f4',gray:'#eff3f4',soft:'#f7f9f9',blue:'#1d9bf0'};
 const font=(size=14,bold=false)=>`${bold?'700':'400'} ${size}px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft Yahei",Arial,sans-serif`;
 const scratch=document.createElement('canvas').getContext('2d');
 const textWidth=(s,size=14,bold=false)=>{scratch.font=font(size,bold);return scratch.measureText(String(s)).width};
 const wrap=(t,max,size=15)=>{scratch.font=font(size);const out=[];for(const raw of String(t||'').split('\n')){if(!raw){out.push('');continue}let line='';for(const ch of Array.from(raw)){if(line&&scratch.measureText(line+ch).width>max){out.push(line);line=ch}else line+=ch}out.push(line)}return out};
 const bubbleW=chatW*(mobile?.78:.73),bodyLeft=chatX+16,bodyRight=w-17;
 const layouts=state.messages.map(m=>{
  if(m.type==='date')return{m,height:37};
  const max=bubbleW-28,lines=wrap(m.text,max,15),tw=Math.max(60,...lines.map(line=>textWidth(line,15))),bubbleWidth=Math.min(bubbleW,Math.max(85,tw+29)),imageHeight=m.type==='image'?Math.min(350,Math.round(bubbleWidth*.86)):0;
  const height=(m.type==='image'?imageHeight+12+(m.text?lines.length*22+12:0):Math.max(1,lines.length)*22+22)+(m.time?20:0)+12;
  return{m,height,lines,bubbleWidth,imageHeight};
 });
 const messagesH=layouts.reduce((n,x)=>n+x.height,0),bodyStart=278,contentH=bodyStart+messagesH+40;
 const chatH=Math.max(675,contentH+65),h=chatH+40,scale=h>7000?1:2;
 if(h>15000)throw Error('对话过长，请减少消息后再导出');
 const cv=document.createElement('canvas');cv.width=w*scale;cv.height=h*scale;const c=cv.getContext('2d');c.scale(scale,scale);
 const rect=(x,y,width,height,color)=>{c.fillStyle=color;c.fillRect(x,y,width,height)};
 const line=(x1,y1,x2,y2,color=colors.border)=>{c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=1;c.stroke()};
 const round=(x,y,width,height,r,color)=>{c.beginPath();c.roundRect(x,y,width,height,r);c.fillStyle=color;c.fill()};
 const txt=(str,x,y,size=14,color=colors.ink,bold=false)=>{c.font=font(size,bold);c.fillStyle=color;c.textBaseline='top';c.fillText(String(str),x,y)};
 const textLines=(arr,x,y,size,color,lh=22)=>arr.forEach((t,i)=>txt(t,x,y+i*lh,size,color));
 const imageCache={};const load=async src=>{if(!src)return null;if(imageCache[src])return imageCache[src];const im=new Image();im.src=src;try{await im.decode();imageCache[src]=im;return im}catch{return null}};
 await Promise.all([state.contactAvatar,state.selfAvatar,...state.messages.filter(m=>m.type==='image').map(m=>m.image)].filter(Boolean).map(load));
 const avatar=(src,name,x,y,r)=>{c.save();c.beginPath();c.arc(x+r,y+r,r,0,Math.PI*2);c.clip();const img=imageCache[src];if(img){const ratio=Math.max(2*r/img.width,2*r/img.height),iw=img.width*ratio,ih=img.height*ratio;c.drawImage(img,x+r-iw/2,y+r-ih/2,iw,ih)}else{rect(x,y,2*r,2*r,'#869aaa');txt(Array.from(String(name||'X'))[0],x+r-7,y+r-9,16,'#fff',true)}c.restore()};
 rect(0,0,w,h,colors.bg);
 // Desktop navigation and conversation list.
 if(!mobile){
  line(navW,0,navW,chatH);line(chatX,0,chatX,chatH);
  txt('𝕏',24,12,31,colors.ink);
  const glyphs=['⌂','⌕','♧','✉','♧','♙','•••'];glyphs.forEach((g,i)=>{if(i===3)round(13,204,49,49,25,colors.soft);txt(g,23,88+i*54,28,colors.ink)});
  avatar(state.selfAvatar,state.selfName,20,chatH-61,19);
  txt('消息',navW+17,17,20,colors.ink,true);line(navW,60,chatX,60);
  round(navW+12,74,inboxW-24,42,21,colors.soft);txt('⌕  搜索私信',navW+29,86,14,colors.muted);
  txt('私信',navW+17,135,15,colors.ink,true);rect(navW,170,inboxW,87,colors.soft);rect(chatX-3,170,3,87,colors.blue);
  avatar(state.contactAvatar,state.contactName,navW+12,184,24);
  txt(state.contactName,navW+74,189,14,colors.ink,true);
  txt('@'+state.contactHandle,navW+74,209,12,colors.muted);
  let last=state.messages.filter(m=>m.type!=='date').at(-1);txt((last?.text||'[图片]').slice(0,27),navW+74,230,12,colors.muted);
 }
 // X DM header.
 if(mobile)txt('←',15,14,25,colors.ink);
 const headLeft=chatX+(mobile?55:17);
 avatar(state.contactAvatar,state.contactName,headLeft,10,20);
 txt(state.contactName,headLeft+52,10,17,colors.ink,true);
 txt('@'+state.contactHandle,headLeft+52,34,12,colors.muted);
 txt('ⓘ',w-39,18,22,colors.ink);line(chatX,61,w,61);
 let y=91;
 avatar(state.contactAvatar,state.contactName,chatX+chatW/2-33,y,33);y+=82;
 const centered=(s,yy,size,col,bold=false)=>txt(s,chatX+chatW/2-textWidth(s,size,bold)/2,yy,size,col,bold);
 centered(state.contactName,y,17,colors.ink,true);y+=26;
 centered('@'+state.contactHandle,y,13,colors.muted);y+=24;
 centered(state.contactBio,y,13,colors.muted);y+=22;
 centered(state.following,y,13,colors.muted);y=bodyStart;
 for(const item of layouts){const m=item.m;
  if(m.type==='date'){centered(m.text||'',y+5,12,colors.muted);y+=item.height;continue}
  const mine=m.sender==='mine',x=mine?bodyRight-item.bubbleWidth:bodyLeft+38;
  const bh=m.type==='image'?item.imageHeight+8+(m.text?item.lines.length*22+12:0):Math.max(1,item.lines.length)*22+22;
  if(!mine)avatar(state.contactAvatar,state.contactName,bodyLeft,y+Math.max(0,bh-29),14);
  if(m.type==='image'){
   const img=imageCache[m.image];round(x,y,item.bubbleWidth,bh,14,colors.gray);
   if(img){const boxW=item.bubbleWidth-6,boxH=item.imageHeight-2,ratio=Math.min(boxW/img.width,boxH/img.height),iw=img.width*ratio,ih=img.height*ratio;c.drawImage(img,x+(item.bubbleWidth-iw)/2,y+3+(boxH-ih)/2,iw,ih)}
   if(m.text)textLines(item.lines,x+12,y+item.imageHeight+7,15,colors.ink,22);
  }else{
   round(x,y,item.bubbleWidth,bh,19,mine?colors.blue:colors.gray);
   textLines(item.lines,x+14,y+12,15,mine?'#fff':colors.ink,22);
  }
  y+=bh+4;
  if(m.time){centered(m.time,y,11,colors.muted);y+=20}
  y+=12;
 }
 // Empty breathing room between the last message and composer.
 const bottom=Math.max(chatH-63,y+13);
 round(chatX+12,bottom,w-chatX-24,49,24,colors.bg);c.strokeStyle=colors.border;c.lineWidth=1;c.stroke();
 txt('▧  GIF  ☺',chatX+27,bottom+13,17,colors.blue);
 txt(state.placeholder||'开始一条新消息',chatX+(mobile?137:157),bottom+15,13,colors.muted);
 txt('➤',w-43,bottom+12,21,colors.blue);
 line(0,chatH,w,chatH);const water=WATERMARK+' · 虚构对话 / 创作截图';
 txt(water,Math.max(12,(w-textWidth(water,11))/2),chatH+13,11,colors.muted);
 const blob=await new Promise((resolve,reject)=>cv.toBlob(b=>b?resolve(b):reject(Error('PNG 生成失败')),'image/png'));
 download(blob,'今日霍格沃茨_X虚构私信截图.png');status('PNG 已导出，包含完整聊天与水印');
 }catch(err){console.error(err);status('导出失败：'+(err?.message||String(err)))}finally{btn.disabled=false}
}
$('exportPNG').onclick=exportPNG;
syncInputs();render();
</script>
